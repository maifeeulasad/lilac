name: Tests

# Unlike the other workflows, this one also runs on pull_request so the suite
# gates merges into main rather than only reporting after the fact.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit:
    name: Unit + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install deps
        run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The visual baselines are the single source of truth, so they are compared
    # in the exact environment that produced them: the official Playwright image,
    # version-matched to @playwright/test in package.json. Its Ubuntu 24.04
    # (noble) base and bundled fonts are what `pnpm test:e2e:update` regenerates
    # against, so screenshots match byte-for-byte here. Bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.59.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install deps
        run: pnpm install
      - name: Run Playwright suite
        run: pnpm exec playwright test
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
