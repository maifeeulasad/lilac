name: Publish to NPM

on:
  release:
    types: [ created ]

jobs:
  publish-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm build

      # Also emit the UMD/global build (window.Lilac) for <script> tag / PHP use.
      - name: Build UMD bundle
        run: pnpm build:umd

      # Guard against a release whose tag does not match the committed version.
      - name: Validate version matches release
        run: |
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG) does not match release tag ($VERSION)"
            exit 1
          fi
          echo "version $PKG matches release $VERSION"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Generate the README + LICENSE and npm metadata at publish time so the
      # repo carries no per-release edits. The root package keeps its own README.
      - name: Prepare package
        run: |
          VERSION="${TAG#v}"
          pnpm build:scripts
          node dist-scripts/script/prepare-package.js . "$VERSION"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Publish core
        run: npm publish --access=public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_ORG }}

  loitering:
    needs: publish-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Wait for core to be available on npm
        run: |
          echo "Waiting for core to be available"
          until npm view @lilac-wysiwyg/core version > /dev/null 2>&1; do
            echo "Still waiting..."
            sleep 10
          done
          echo "@lilac-wysiwyg/core is now available on npm!"

      - name: Wait 1 minute
        run: sleep 60

  publish-adapters:
    needs: loitering
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        package:
          - adapter/alpine
          - adapter/angular
          - adapter/astro
          - adapter/ember
          - adapter/lit
          - adapter/preact
          - adapter/qwik
          - adapter/react
          - adapter/solid
          - adapter/svelte
          - adapter/vanilla
          - adapter/vue

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install deps
        run: pnpm install

      # Adapters resolve @lilac-wysiwyg/core's types from the root build, so it
      # has to happen before theirs.
      - name: Build core
        run: pnpm build

      - name: Install adapter deps
        working-directory: ${{ matrix.package }}
        run: pnpm install --ignore-scripts

      - name: Build
        working-directory: ${{ matrix.package }}
        run: pnpm build

      # Guard against a release whose tag does not match the committed version.
      - name: Validate version matches release
        working-directory: ${{ matrix.package }}
        run: |
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::${{ matrix.package }} version ($PKG) does not match release tag ($VERSION)"
            exit 1
          fi
          echo "version $PKG matches release $VERSION"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Generate the per-package README + LICENSE and stamp the release version
      # and metadata (runs from the repo root so the root LICENSE resolves).
      - name: Prepare package
        run: |
          VERSION="${TAG#v}"
          pnpm build:scripts
          node dist-scripts/script/prepare-package.js "${{ matrix.package }}" "$VERSION"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Verify entry point exists before publishing
        working-directory: ${{ matrix.package }}
        run: |
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            for (const entry of [pkg.main, pkg.types]) {
              if (!fs.existsSync(entry)) {
                console.error('refusing to publish ' + pkg.name + ': ' + entry + ' does not exist');
                process.exit(1);
              }
            }
            console.log('entry points present for ' + pkg.name);
          "

      - name: Publish ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: npm publish --access=public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_ORG }}

  # PHP / Composer: the package lives in this same repo (root composer.json),
  # so publishing is just telling Packagist to fetch the new git tag. Requires
  # the package to have been submitted once at packagist.org. Non-fatal: a
  # Packagist misconfig must not fail the npm release.
  publish-php:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist of the new release
        continue-on-error: true
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME || 'maifeeulasad' }}
        run: |
          echo "Nudging Packagist to fetch the new tag as $PACKAGIST_USERNAME…"
          code=$(curl -s -o /tmp/pk.out -w '%{http_code}' -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/maifeeulasad/lilac"}}')
          echo "HTTP $code"; cat /tmp/pk.out || true; echo
          if [ "$code" != "202" ] && [ "$code" != "200" ]; then
            echo "::warning::Packagist update returned HTTP $code. Submit lilac-wysiwyg/lilac at packagist.org once, and confirm PACKAGIST_USERNAME (repo variable) and PACKAGIST_TOKEN (secret)."
          fi
