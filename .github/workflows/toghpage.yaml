name: Publish Docs to GH Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: "Install pnpm"
        run: npm i -g pnpm
      - name: "Install deps"
        run: pnpm install
      # The demo pages import the built ESM (./index.js) relative to themselves,
      # so the compiled library has to ship with them. `pnpm build` produces the
      # library in dist/; the docs pages are then copied in alongside it.
      - name: "Build the library"
        run: pnpm build
      - name: "Copy documentation pages alongside the build"
        run: cp -r docs/* dist/
      # Frameworks that need their own build (Qwik's optimizer, Ember's
      # toolchain) can't run from a CDN, so each has a tiny Vite app under
      # playground/. Build them here and drop the static output under
      # dist/playground/<name>/, which the docs pages embed via an iframe.
      # Built with npm (not pnpm): these apps need esbuild's install script to
      # run, which newer pnpm blocks by default. npm runs it normally.
      - name: "Build playground micro-bundles"
        run: |
          for dir in playground/*/; do
            [ -f "${dir}package.json" ] || continue
            name="$(basename "$dir")"
            echo "== building $name playground =="
            (cd "$dir" && npm install --no-audit --no-fund && npm run build)
            mkdir -p "dist/playground/$name"
            cp -r "${dir}dist/." "dist/playground/$name/"
          done
      # The live playgrounds load the published adapters from a CDN at the
      # version stamped here, so they always match the current package version.
      - name: "Stamp docs with the package version"
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "stamping docs playgrounds with $VERSION"
          find dist -name '*.html' -exec sed -i "s/__LILAC_VERSION__/$VERSION/g" {} +
      - name: "Deploy"
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./dist
          allow_empty_commit: true
